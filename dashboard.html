<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة المطعم - سُفرة</title><style>*{box-sizing:border-box;font-family:Arial;margin:0}body{background:#0a0a0a;color:#fff;padding:15px}.top{display:flex;justify-content:space-between;align-items:center}h1 span{color:#c9a227}.badge{background:#1a3a1a;color:#4caf50;padding:5px 12px;border-radius:20px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.card{background:#141414;border:1px solid #222;border-radius:16px;padding:15px;text-align:center}.card b{font-size:22px;display:block}.card span{color:#aaa;font-size:12px}.box{background:#141414;border:1px solid #222;border-radius:16px;padding:15px;margin:10px 0}input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:5px 0}button{width:100%;padding:13px;border-radius:25px;border:0;background:linear-gradient(135deg,#f5d76e,#c9a227);font-weight:900;margin-top:8px;cursor:pointer}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222}a{color:#c9a227}</style></head><body>
<div class="top"><h1>🍽️ لوحة <span id="rn">مطعمك</span></h1><span class="badge">● تجربة مجانية - 14 يوم</span></div>
<div class="grid"><div class="card"><b id="orders">0</b><span>طلب اليوم</span></div><div class="card"><b id="sales">0 ر.ي</b><span>مبيعات اليوم</span></div><div class="card"><b>3</b><span>طاولات مشغولة</span></div><div class="card"><b>4.8 ⭐</b><span>تقييمك</span></div></div>
<div class="box"><h3>➕ أضف صنف جديد للمنيو</h3><input id="iname" placeholder="اسم الصنف - مثال: فحسة"><input id="iprice" type="number" placeholder="السعر بالريال - مثال: 2500"><button onclick="add()">إضافة للمنيو ✅</button></div>
<div class="box"><h3>📋 منيو مطعمك</h3><div id="list"><div class="item"><span>🍖 فحسة لحم</span><b>2500 ر.ي</b></div><div class="item"><span>🍗 مندي دجاج</span><b>3500 ر.ي</b></div><div class="item"><span>🥤 عصير مانجو</span><b>1000 ر.ي</b></div></div></div>
<div class="box"><h3>🧾 فاتورة تجريبية</h3><button onclick="bill()">اطبع فاتورة تجريبية 🧾</button><div id="bill"></div></div>
<a href="index.html">← رجوع للرئيسية</a>
  <div class="box"><h3>💳 محافظ الدفع</h3><input id="n1" placeholder="اسم صاحب الكريمي"><input id="w1" placeholder="رقم الكريمي"><input id="n2" placeholder="اسم صاحب ام فلوس"><input id="w2" placeholder="رقم ام فلوس"><input id="n3" placeholder="اسم صاحب ون كاش"><input id="w3" placeholder="رقم ون كاش"><input id="n4" placeholder="اسم صاحب جيب"><input id="w4" placeholder="رقم جيب"><input id="n5" placeholder="اسم صاحب فلوسك"><input id="w5" placeholder="رقم فلوسك"><button onclick="saveW()">حفظ المحافظ ✅</button><div id="wmsg"></div></div><script>function saveW(){let o={};for(let i=1;i<=5;i++){o['n'+i]=document.getElementById('n'+i).value;o['w'+i]=document.getElementById('w'+i).value}localStorage.setItem('wallets',JSON.stringify(o));wmsg.innerText='تم الحفظ ✅'}let w=JSON.parse(localStorage.getItem('wallets')||'{}');for(let i=1;i<=5;i++){if(w['n'+i])document.getElementById('n'+i).value=w['n'+i];if(w['w'+i])document.getElementById('w'+i).value=w['w'+i]}</script>
<script>let u=localStorage.getItem('sufra_user')||'مطعمك';document.getElementById('rn').innerText=u;function add(){let n=document.getElementById('iname').value;let p=document.getElementById('iprice').value;if(!n||!p){alert('اكتب الاسم والسعر');return}document.getElementById('list').innerHTML+='<div class="item"><span>🍽️ '+n+'</span><b>'+p+' ر.ي</b></div>';alert('تمت الإضافة!');}function bill(){document.getElementById('orders').innerText=1;document.getElementById('sales').innerText='2,500 ر.ي';document.getElementById('bill').innerHTML='<hr><p>مطعم '+u+'</p><p>فحسة لحم - 2500</p><p><b>الإجمالي: 2500 ر.ي</b></p><p>شكراً لزيارتكم - سُفرة 🍽️</p>';}</script></body></html>
<script>let pimgData='';let fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.style='margin:8px 0';fi.onchange=e=>{let r=new FileReader();r.onload=()=>pimgData=r.result;r.readAsDataURL(e.target.files[0])};document.querySelectorAll('.box')[0].appendChild(fi);let oldAdd=window.addDish;if(oldAdd){window.addDish=function(){let r=oldAdd();setTimeout(()=>{if(pimgData){let m=JSON.parse(localStorage.getItem('menu')||localStorage.getItem('dishes')||'[]');if(m.length){m[m.length-1].img=pimgData;localStorage.setItem('menu',JSON.stringify(m));localStorage.setItem('dishes',JSON.stringify(m));}pimgData='';}loadMenu&&loadMenu();},300);return r;}}</script>
