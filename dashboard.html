<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم سفرة</title><style>body{font-family:system-ui;background:#f5f5f5;padding:14px;max-width:700px;margin:auto}h1{text-align:center}.box{background:#fff;padding:14px;border-radius:14px;margin:10px 0}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.add{background:#111;color:#fff;width:100%}.save{background:#25D366;width:100%;font-size:17px;margin-top:10px}.ordersbtn{background:#FFC107;width:100%;font-size:17px;margin-top:8px}.item{display:flex;gap:10px;background:#fff;padding:10px;border-radius:12px;margin:8px 0;align-items:center}.item img{width:70px;height:70px;object-fit:cover;border-radius:10px}.del{background:#ff4444;color:#fff}</style></head>
<body><h1>🍽️ لوحة تحكم سفرة</h1><p style="text-align:center"><a href="orders.html"><button class="ordersbtn">📋 فتح صفحة الطلبات</button></a></p>
<div class="box"><h3>💳 أرقام المحافظ</h3><label>الكريمي جوالي</label><input id="w_kuraimi"><label>ون كاش</label><input id="w_onecash"><label>محفظة جيب</label><input id="w_jib"><label>محفظة فلوسك</label><input id="w_flusak"></div>
<div class="box"><h3>➕ أضف منتج</h3><input id="pname" placeholder="اسم المنتج"><input id="pprice" type="number" placeholder="السعر"><input id="pcat" placeholder="التصنيف"><input id="pdesc" placeholder="وصف (اختياري)"><label>صورة المنتج:</label><input id="pimg" type="file" accept="image/*"><img id="preview" style="width:100%;border-radius:10px;display:none"><button class="add" onclick="addDish()">إضافة للمنيو ✅</button></div>
<div id="list"></div><button class="save" onclick="saveToCloud()">💾 حفظ ونشر للزبائن</button><p id="msg" style="text-align:center"></p><p style="text-align:center"><a href="index.html">صفحة الزبون 👁️</a> | <a href="orders.html">صفحة الطلبات 📋</a></p>
<script>
const BIN_ID="6b08ef651b390e1b559a6825";
const API_KEY="$2a$10$mbHV9CAClVSa6jhqWDi1Re/ZkrGge9deNP5Cm8WVs.MSxc8XqVqGS";
const H={"X-Master-Key":API_KEY,"Content-Type":"application/json"};
let menu=[],wallets={},imgData="";
function fillWallets(){document.getElementById("w_kuraimi").value=wallets["الكريمي جوالي"]||"";document.getElementById("w_onecash").value=wallets["ون كاش OneCash"]||"";document.getElementById("w_jib").value=wallets["محفظة جيب Jib"]||"";document.getElementById("w_flusak").value=wallets["محفظة فلوسك Flusak"]||""}
document.getElementById("pimg").onchange=e=>{let file=e.target.files[0]; if(!file)return; let img=new Image(); let url=URL.createObjectURL(file); img.onload=()=>{let c=document.createElement("canvas"); let max=500,w=img.width,h=img.height; if(w>max){h=h*max/w;w=max} c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h); imgData=c.toDataURL("image/jpeg",0.7); let p=document.getElementById("preview"); p.src=imgData; p.style.display="block"}; img.src=url};
function addDish(){let n=document.getElementById("pname").value.trim(),pr=+document.getElementById("pprice").value; if(!n||!pr)return alert("اكتب الاسم والسعر"); menu.push({name:n,price:pr,cat:document.getElementById("pcat").value.trim()||"عام",desc:document.getElementById("pdesc").value,img:imgData||"https://via.placeholder.com/400x300?text="+encodeURIComponent(n)}); imgData=""; document.getElementById("pname").value="";document.getElementById("pprice").value="";document.getElementById("pimg").value="";document.getElementById("preview").style.display="none"; render()}
function del(i){if(confirm("حذف؟")){menu.splice(i,1);render()}}
function render(){document.getElementById("list").innerHTML="<h3>المنيو الحالي ("+menu.length+")</h3>"+menu.map((m,i)=>`<div class="item"><img src="${m.img}"><div style="flex:1"><b>${m.name}</b><br>${m.price} ريال - ${m.cat}</div><button class="del" onclick="del(${i})">حذف</button></div>`).join("")}
function getWallets(){let w={}; let a=document.getElementById("w_kuraimi").value.trim(),b=document.getElementById("w_onecash").value.trim(),c=document.getElementById("w_jib").value.trim(),d=document.getElementById("w_flusak").value.trim(); if(a)w["الكريمي جوالي"]=a; if(b)w["ون كاش OneCash"]=b; if(c)w["محفظة جيب Jib"]=c; if(d)w["محفظة فلوسك Flusak"]=d; return w}
async function getBin(){let r=await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID+"/latest",{headers:{"X-Master-Key":API_KEY}}); let j=await r.json(); return j.record||{menu:[],wallets:{},orders:[]}}
async function saveToCloud(){wallets=getWallets(); document.getElementById("msg").textContent="جارٍ النشر..."; try{let old=await getBin(); await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID,{method:"PUT",headers:H,body:JSON.stringify({menu,wallets,orders:old.orders||[]})}); document.getElementById("msg").textContent="✅ تم النشر! الطلبات محفوظة"}catch(e){document.getElementById("msg").textContent="❌ فشل النشر - حاول مرة ثانية"}}
async function loadCloud(){try{let d=await getBin(); menu=d.menu||[]; wallets=d.wallets||{};}catch(e){} fillWallets(); render()}
loadCloud();
</script></body></html>
