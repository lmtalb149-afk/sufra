<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم سفرة</title>
<style>body{font-family:system-ui;background:#f5f5f5;padding:14px;max-width:700px;margin:auto}h1{text-align:center}.box{background:#fff;padding:14px;border-radius:14px;margin:10px 0}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.add{background:#111;color:#fff;width:100%}.save{background:#25D366;width:100%;font-size:17px;margin-top:10px}.item{display:flex;gap:10px;background:#fff;padding:10px;border-radius:12px;margin:8px 0;align-items:center}.item img{width:70px;height:70px;object-fit:cover;border-radius:10px}.del{background:#ff4444;color:#fff}</style></head>
<body><h1>🍽️ لوحة تحكم سفرة</h1>
<div class="box"><h3>➕ أضف منتج جديد</h3>
<input id="pname" placeholder="اسم المنتج - مثال: برجر"><input id="pprice" type="number" placeholder="السعر - مثال: 2500"><input id="pcat" placeholder="التصنيف - مثال: برجر / بيتزا / عصائر"><input id="pdesc" placeholder="وصف (اختياري)"><label>صورة المنتج:</label><input id="pimg" type="file" accept="image/*"><img id="preview" style="width:100%;border-radius:10px;display:none"><button class="add" onclick="addDish()">إضافة للمنيو ✅</button></div>
<div id="list"></div>
<button class="save" onclick="saveToCloud()">💾 حفظ ونشر للزبائن</button>
<p id="msg" style="text-align:center"></p><p style="text-align:center"><a href="index.html">فتح صفحة الزبون 👁️</a></p>
<script>
const BIN_ID="16cb9e7ed2119866122b";
let menu=JSON.parse(localStorage.getItem("sufra_menu")||"[]");
let imgData="";
document.getElementById("pimg").onchange=e=>{let r=new FileReader();r.onload=()=>{imgData=r.result;let p=document.getElementById("preview");p.src=imgData;p.style.display="block"};r.readAsDataURL(e.target.files[0])};
function addDish(){
 let n=document.getElementById("pname").value.trim(), pr=+document.getElementById("pprice").value;
 if(!n||!pr) return alert("اكتب الاسم والسعر");
 menu.push({name:n,price:pr,cat:document.getElementById("pcat").value.trim()||"عام",desc:document.getElementById("pdesc").value,img:imgData||"https://via.placeholder.com/400x300?text="+encodeURIComponent(n)});
 localStorage.setItem("sufra_menu",JSON.stringify(menu)); imgData=""; document.getElementById("pname").value="";document.getElementById("pprice").value="";document.getElementById("pimg").value="";document.getElementById("preview").style.display="none"; render();
}
function del(i){if(confirm("حذف؟")){menu.splice(i,1);localStorage.setItem("sufra_menu",JSON.stringify(menu));render()}}
function render(){document.getElementById("list").innerHTML="<h3>المنيو الحالي ("+menu.length+")</h3>"+menu.map((m,i)=>`<div class="item"><img src="${m.img}"><div style="flex:1"><b>${m.name}</b><br>${m.price} ريال - ${m.cat}</div><button class="del" onclick="del(${i})">حذف</button></div>`).join("")}
async function saveToCloud(){
 document.getElementById("msg").textContent="جارٍ النشر...";
 try{let r=await fetch("https://api.npoint.io/"+BIN_ID,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({menu})}); if(!r.ok) throw 0; document.getElementById("msg").textContent="✅ تم النشر! الزبائن بيشوفون المنيو الجديد الآن"}catch(e){document.getElementById("msg").textContent="❌ فشل النشر - تأكد من الـ ID"}}
async function loadCloud(){try{let r=await fetch("https://api.npoint.io/"+BIN_ID); let j=await r.json(); if(j.menu){menu=j.menu;localStorage.setItem("sufra_menu",JSON.stringify(menu))}}catch(e){} render()}
loadCloud();
</script></body></html>
