<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفرة</title><style>body{font-family:system-ui;background:#f5f5f5;padding:12px;max-width:700px;margin:auto}h1{text-align:center}.item{display:flex;gap:10px;background:#fff;padding:10px;border-radius:12px;margin:8px 0;align-items:center}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px}.add{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:800}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}button{cursor:pointer}.orderbtn{background:#25D366;width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:18px}.cart{background:#fff;padding:12px;border-radius:12px;margin:10px 0}</style></head>
<body><h1>🍽️ سفرة</h1><p id="status" style="text-align:center;color:#888">جارٍ تحميل المنيو...</p><div id="menu"></div>
<div class="cart"><h3>🛒 سلة الطلب</h3><div id="cart">السلة فاضية</div><p id="total"></p>
<input id="cname" placeholder="اسمك"><input id="cphone" placeholder="رقم جوالك"><input id="caddr" placeholder="عنوانك / موقعك">
<label>طريقة الدفع:</label><select id="pay" onchange="showPay()"><option value="كاش">💵 كاش عند التوصيل</option><option value="محفظة">📱 محفظة الكترونية</option></select>
<div id="walletsBox" style="display:none"></div>
<div id="receiptBox" style="display:none"><label>📸 صورة اشعار التحويل:</label><input id="receipt" type="file" accept="image/*"><img id="rprev" style="width:100%;border-radius:10px;display:none"></div>
<button class="orderbtn" onclick="sendOrder()">تأكيد الطلب ✅</button><p id="msg" style="text-align:center"></p></div>
<script>
const BIN_ID="6b08ef651b390e1b559a6825";
const API_KEY="$2a$10$mbHV9CAClVSa6jhqWDi1Re/ZkrGge9deNP5Cm8WVs.MSxc8XqVqGS";
const H={"X-Master-Key":API_KEY,"Content-Type":"application/json"};
let menu=[],wallets={},cart=[],receiptData="";
async function getBin(){let r=await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID+"/latest",{headers:{"X-Master-Key":API_KEY}}); let j=await r.json(); return j.record||{menu:[],wallets:{},orders:[]}}
async function putBin(d){await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID,{method:"PUT",headers:H,body:JSON.stringify(d)})}
async function load(){try{let d=await getBin(); menu=d.menu||[]; wallets=d.wallets||{}; document.getElementById("status").textContent=""; renderMenu();}catch(e){document.getElementById("status").textContent="تعذر تحميل المنيو - حدث الصفحة"}}
function renderMenu(){document.getElementById("menu").innerHTML=menu.map((m,i)=>`<div class="item"><img src="${m.img}"><div style="flex:1"><b>${m.name}</b><br>${m.price} ريال - ${m.cat||""}<br><small>${m.desc||""}</small></div><button class="add" onclick="addToCart(${i})">أضف +</button></div>`).join("")||"لا توجد منتجات بعد"}
function addToCart(i){let f=cart.find(x=>x.name==menu[i].name); if(f)f.qty++; else cart.push({name:menu[i].name,price:menu[i].price,qty:1}); renderCart()}
function renderCart(){let t=0; document.getElementById("cart").innerHTML=cart.map(c=>{t+=c.price*c.qty; return c.name+" × "+c.qty+" = "+(c.price*c.qty)+" ريال"}).join("<br>")||"السلة فاضية"; document.getElementById("total").textContent=cart.length?"الإجمالي: "+t+" ريال":""}
function showPay(){let p=document.getElementById("pay").value; let wb=document.getElementById("walletsBox"); if(p=="محفظة"){wb.style.display="block"; wb.innerHTML="<b>حول على واحد من هذي الأرقام:</b><br>"+Object.entries(wallets).map(([k,v])=>k+": <b dir='ltr'>"+v+"</b>").join("<br>")||"لا توجد محافظ"; document.getElementById("receiptBox").style.display="block"}else{wb.style.display="none"; document.getElementById("receiptBox").style.display="none"}}
document.getElementById("receipt").onchange=e=>{let f=e.target.files[0]; if(!f)return; let img=new Image(); let u=URL.createObjectURL(f); img.onload=()=>{let c=document.createElement("canvas"); let max=500,w=img.width,h=img.height; if(w>max){h=h*max/w;w=max} c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h); receiptData=c.toDataURL("image/jpeg",0.6); let p=document.getElementById("rprev"); p.src=receiptData; p.style.display="block"}; img.src=u};
async function sendOrder(){if(!cart.length)return alert("السلة فاضية"); let name=document.getElementById("cname").value.trim(),ph=document.getElementById("cphone").value.trim(),ad=document.getElementById("caddr").value.trim(); if(!name||!ph)return alert("اكتب اسمك ورقمك"); if(document.getElementById("pay").value=="محفظة"&&!receiptData)return alert("ارفق صورة الاشعار"); document.getElementById("msg").textContent="جارٍ ارسال الطلب..."; try{let d=await getBin(); let total=cart.reduce((s,c)=>s+c.price*c.qty,0); let order={id:Date.now(),name,phone:ph,address:ad,pay:document.getElementById("pay").value,items:cart,total,receipt:receiptData,time:new Date().toLocaleString("ar-EG"),status:"جديد"}; d.orders=d.orders||[]; d.orders.unshift(order); await putBin(d); document.getElementById("msg").textContent="✅ تم ارسال طلبك! بنتواصل معك"; cart=[]; renderCart();}catch(e){document.getElementById("msg").textContent="❌ فشل ارسال الطلب - حاول مرة ثانية"}}
load();
</script></body></html>
