<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفرة</title><style>body{font-family:system-ui;background:#f5f5f5;padding:12px;max-width:700px;margin:auto}h1{text-align:center}.item{display:flex;gap:10px;background:#fff;padding:10px;border-radius:12px;margin:8px 0;align-items:center}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px}.add{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:800}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}button{cursor:pointer}.orderbtn{background:#25D366;width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:18px}.cart{background:#fff;padding:12px;border-radius:12px;margin:10px 0}.tablebox{background:#FFF3CD;padding:12px;border-radius:12px;margin:10px 0;border:2px dashed #FFC107}.paybox{background:#E8F5E9;padding:12px;border-radius:12px;margin:10px 0}.walletnum{background:#fff;padding:10px;border-radius:10px;text-align:center;font-size:20px;font-weight:800;margin:8px 0}.qty{display:flex;gap:6px;align-items:center}.qty button{width:32px;height:32px;border-radius:8px;font-size:18px;font-weight:800}.qty .plus{background:#25D366;color:#fff;border:0}.qty .minus{background:#eee;border:0}.cartline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #eee}</style></head>
<body><h1>🍽️ سفرة</h1><p id="status" style="text-align:center;color:#888">جارٍ تحميل المنيو...</p>
<div class="tablebox"><label><b>🪑 رقم الطاولة:</b></label><input id="ctable" type="number" placeholder="مثال: 5"></div>
<div id="menu"></div>
<div class="cart"><h3>🛒 سلة الطلب</h3><div id="cart">السلة فاضية</div><p id="total" style="font-weight:800;font-size:18px"></p>
<input id="cname" placeholder="اسمك"><input id="cphone" placeholder="رقم جوالك"><input id="caddr" placeholder="عنوانك / للتوصيل - اتركه فاضي اذا انت في المطعم">
<div class="paybox"><h3>💳 طريقة الدفع - اختر واحدة:</h3>
<label><input type="radio" name="pay" value="كاش" checked onchange="showPay()" style="width:auto"> 💵 كاش عند التوصيل / عند الكاشير</label><br><br>
<label><input type="radio" name="pay" value="محفظة" onchange="showPay()" style="width:auto"> 📱 محفظة الكترونية</label>
<div id="walletSelectBox" style="display:none;margin-top:10px"><label>اختر المحفظة:</label><select id="walletChoice" onchange="showWalletNum()"></select><div id="walletNum" class="walletnum"></div><p style="font-size:13px;text-align:center">حول المبلغ على الرقم فوق، وبعدين ارفق صورة الاشعار 👇</p></div>
<div id="receiptBox" style="display:none"><label>📸 صورة اشعار التحويل:</label><input id="receipt" type="file" accept="image/*"><img id="rprev" style="width:100%;border-radius:10px;display:none"></div></div>
<button class="orderbtn" onclick="sendOrder()">تأكيد الطلب ✅</button><p id="msg" style="text-align:center"></p></div>
<script>
const BIN_ID="6b08ef651b390e1b559a6825";
const API_KEY="$2a$10$mbHV9CAClVSa6jhqWDi1Re/ZkrGge9deNP5Cm8WVs.MSxc8XqVqGS";
const H={"X-Master-Key":API_KEY,"Content-Type":"application/json"};
let menu=[],wallets={},cart=[],receiptData="";
function getPay(){return document.querySelector('input[name="pay"]:checked').value}
async function getBin(){let r=await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID+"/latest",{headers:{"X-Master-Key":API_KEY}}); let j=await r.json(); return j.record||{menu:[],wallets:{},orders:[]}}
async function putBin(d){await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID,{method:"PUT",headers:H,body:JSON.stringify(d)})}
async function load(){try{let d=await getBin(); menu=d.menu||[]; wallets=d.wallets||{}; document.getElementById("status").textContent=""; renderMenu(); buildWalletSelect();}catch(e){document.getElementById("status").textContent="تعذر تحميل المنيو - حدث الصفحة"}}
function renderMenu(){document.getElementById("menu").innerHTML=menu.map((m,i)=>`<div class="item"><img src="${m.img}"><div style="flex:1"><b>${m.name}</b><br>${m.price} ريال - ${m.cat||""}<br><small>${m.desc||""}</small></div><button class="add" onclick="addToCart(${i})">أضف +</button></div>`).join("")||"لا توجد منتجات بعد"}
function addToCart(i){let f=cart.find(x=>x.name==menu[i].name); if(f)f.qty++; else cart.push({name:menu[i].name,price:menu[i].price,qty:1}); renderCart()}
function changeQty(idx,delta){cart[idx].qty+=delta; if(cart[idx].qty<=0)cart.splice(idx,1); renderCart()}
function renderCart(){let t=0; document.getElementById("cart").innerHTML=cart.map((c,idx)=>{t+=c.price*c.qty; return `<div class="cartline"><span>${c.name}<br><small>${c.price} ريال</small></span><span class="qty"><button class="minus" onclick="changeQty(${idx},-1)">-</button><b>${c.qty}</b><button class="plus" onclick="changeQty(${idx},1)">+</button><span> = ${c.price*c.qty}</span></span></div>`}).join("")||"السلة فاضية"; document.getElementById("total").textContent=cart.length?"الإجمالي: "+t+" ريال":""}
function buildWalletSelect(){let s=document.getElementById("walletChoice"); let keys=Object.keys(wallets); s.innerHTML=keys.map(k=>`<option value="${k}">${k}</option>`).join(""); if(keys.length)showWalletNum()}
function showWalletNum(){let k=document.getElementById("walletChoice").value; document.getElementById("walletNum").innerHTML=k+"<br><span dir='ltr'>"+(wallets[k]||"")+"</span>"}
function showPay(){let p=getPay(); document.getElementById("walletSelectBox").style.display=p=="محفظة"?"block":"none"; document.getElementById("receiptBox").style.display=p=="محفظة"?"block":"none"}
document.getElementById("receipt").onchange=e=>{let f=e.target.files[0]; if(!f)return; let img=new Image(); let u=URL.createObjectURL(f); img.onload=()=>{let c=document.createElement("canvas"); let max=500,w=img.width,h=img.height; if(w>max){h=h*max/w;w=max} c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h); receiptData=c.toDataURL("image/jpeg",0.6); let p=document.getElementById("rprev"); p.src=receiptData; p.style.display="block"}; img.src=u};
async function sendOrder(){if(!cart.length)return alert("السلة فاضية"); let name=document.getElementById("cname").value.trim(),ph=document.getElementById("cphone").value.trim(),ad=document.getElementById("caddr").value.trim(),tab=document.getElementById("ctable").value.trim(); if(!name||!ph)return alert("اكتب اسمك ورقمك"); if(!tab)return alert("اكتب رقم الطاولة"); let pay=getPay(); let walletName=pay=="محفظة"?document.getElementById("walletChoice").value:""; if(pay=="محفظة"&&!receiptData)return alert("ارفق صورة الاشعار"); document.getElementById("msg").textContent="جارٍ ارسال الطلب..."; try{let d=await getBin(); let total=cart.reduce((s,c)=>s+c.price*c.qty,0); let order={id:Date.now(),name,phone:ph,address:ad,table:tab,pay:pay+(walletName?" - "+walletName:""),wallet:walletName,items:cart,total,receipt:receiptData,time:new Date().toLocaleString("ar-EG"),status:"جديد"}; d.orders=d.orders||[]; d.orders.unshift(order); await putBin(d); document.getElementById("msg").textContent="✅ تم ارسال طلبك! طاولة "+tab; cart=[]; renderCart();}catch(e){document.getElementById("msg").textContent="❌ فشل ارسال الطلب - حاول مرة ثانية"}}
load();
</script></body></html>
