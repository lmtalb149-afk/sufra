<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات سفرة</title><style>body{font-family:system-ui;background:#f5f5f5;padding:12px;max-width:700px;margin:auto}.card{background:#fff;padding:14px;border-radius:14px;margin:10px 0}button{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.done{background:#25D366;color:#fff}.del{background:#ff4444;color:#fff}.print{background:#111;color:#fff}img{max-width:100%;border-radius:10px}.table{font-size:22px;background:#FFF3CD;padding:8px;border-radius:10px;text-align:center}.isdone{border:3px solid #25D366}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;top:0;right:0;left:0;padding:20px;background:#fff}}</style></head>
<body><h1 style="text-align:center">📋 طلبات سفرة</h1><p style="text-align:center"><button onclick="load()">🔄 تحديث</button> <a href="dashboard.html"><button>لوحة التحكم</button></a></p><p id="status" style="text-align:center"></p><div id="list"></div><div id="printArea" style="display:none"></div>
<script>
const BIN_ID="6b08ef651b390e1b559a6825";
const API_KEY="$2a$10$mbHV9CAClVSa6jhqWDi1Re/ZkrGge9deNP5Cm8WVs.MSxc8XqVqGS";
const H={"X-Master-Key":API_KEY,"Content-Type":"application/json"};
let data={menu:[],wallets:{},orders:[]};
async function load(){document.getElementById("status").textContent="جارٍ التحميل..."; try{let r=await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID+"/latest",{headers:{"X-Master-Key":API_KEY}}); let j=await r.json(); data=j.record||data; document.getElementById("status").textContent=""; render();}catch(e){document.getElementById("status").textContent="❌ خطأ - حدث الصفحة"}}
function render(){let o=data.orders||[]; document.getElementById("list").innerHTML=o.length?o.map((x,i)=>`<div class="card ${x.status=='تم'?'isdone':''}"><div class="table">🪑 طاولة ${x.table||"؟"} ${x.status=='تم'?'✅ تم':''}</div><br><b>${x.name}</b> - <span dir="ltr">${x.phone}</span><br>📍 ${x.address||"داخل المطعم"}<br>💳 ${x.pay} - الإجمالي: <b>${x.total} ريال</b><br>🕒 ${x.time}<br><br>${x.items.map(it=>it.name+" × "+it.qty+" = "+(it.qty*it.price)+" ريال").join("<br>")}${x.receipt?`<br><br>📸 اشعار التحويل:<br><img src="${x.receipt}">`:""}<br><br><button class="print" onclick="printInvoice(${i})">🖨️ طباعة فاتورة</button> <button class="done" onclick="doneOrder(${i})">✅ موافق / تم</button> <button class="del" onclick="delOrder(${i})">حذف</button></div>`).join(""):"<p style='text-align:center'>لا توجد طلبات بعد</p>"}
async function save(){document.getElementById("status").textContent="جارٍ الحفظ..."; try{let res=await fetch("https://api.jsonbin.io/v3/b/"+BIN_ID,{method:"PUT",headers:H,body:JSON.stringify(data)}); if(!res.ok)throw 0; document.getElementById("status").textContent="✅ تم الحفظ";}catch(e){document.getElementById("status").textContent="❌ فشل الحفظ - جرب مرة ثانية"} render()}
async function doneOrder(i){data.orders[i].status="تم"; await save(); alert("تم تأكيد الطلب ✅")}
async function delOrder(i){if(confirm("حذف الطلب؟")){data.orders.splice(i,1); await save()}}
function printInvoice(i){let x=data.orders[i]; let html=`<div style="text-align:center;font-family:system-ui"><h2>🍽️ مطعم سفرة</h2><p>فاتورة رقم: ${x.id}<br>${x.time}</p><hr><h3>🪑 طاولة ${x.table||"-"}</h3><p>الزبون: ${x.name}<br>الجوال: ${x.phone}<br>الدفع: ${x.pay}</p><hr>${x.items.map(it=>`<div style="display:flex;justify-content:space-between"><span>${it.name} × ${it.qty}</span><span>${it.qty*it.price} ريال</span></div>`).join("")}<hr><h3>الإجمالي: ${x.total} ريال</h3><p>شكراً لكم ❤️</p></div>`; let pa=document.getElementById("printArea"); pa.innerHTML=html; pa.style.display="block"; setTimeout(()=>{window.print(); pa.style.display="none"},100)}
load();
</script></body></html>
