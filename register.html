<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>جرب مجاناً - سفرة</title>
<style>*{box-sizing:border-box;font-family:system-ui,Tahoma}body{background:#0f172a;color:#fff;margin:0;padding:16px}.card{background:#fff;color:#222;border-radius:16px;padding:16px;max-width:450px;margin:20px auto}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px}button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-wa{background:#25D366;color:#fff;margin-top:8px}img{max-width:200px}</style></head>
<body>
<div class="card" id="formBox">
<h1 style="text-align:center">🍽️ جرب سفرة مجاناً 14 يوم</h1>
<p style="text-align:center;color:#666">سجل و يشتغل موقعك + QR مباشرة</p>
<input id="rName" placeholder="اسم المطعم">
<input id="rOwner" placeholder="اسم صاحب المطعم">
<input id="rPhone" placeholder="رقم جوالك">
<input id="rPass" type="password" placeholder="اختار كلمة مرور لمطعمك">
<button class="btn-green" onclick="doRegister()">تفعيل التجريبي المجاني + توليد QR ✅</button>
<p style="text-align:center"><a href="index.html">رجوع</a></p>
</div>

<div class="card" id="doneBox" style="display:none;text-align:center">
<h2>🎉 مبروك! مطعمك اشتغل</h2>
<p id="info"></p>
<h3>امسح QR لعرض قائمتك</h3>
<img id="qrImg"><br><br>
<p>رابط قائمتك:</p><a id="menuLink" target="_blank"></a><br><br>
<button class="btn-green" onclick="goLogin()">دخول لوحة مطعمي</button>
<button class="btn-wa" onclick="sendWA('تجريبي')">📱 أرسل للمالك واتساب أني سجلت</button>
<hr>
<h3>عجبك الموقع؟ اشترك الآن</h3>
<select id="plan"><option value="monthly">شهري - 15,000 ر.ي</option><option value="3months">3 شهور - 40,000 ر.ي</option><option value="yearly">سنوي - 120,000 ر.ي</option></select>
<button class="btn-green" onclick="requestSub()">اطلب اشتراك + أرسل واتساب</button>
</div>
<script>
let myRest=null;
function doRegister(){
 let name=document.getElementById('rName').value, owner=document.getElementById('rOwner').value, phone=document.getElementById('rPhone').value, pass=document.getElementById('rPass').value;
 if(!name||!phone||!pass) return alert('عبّي كل البيانات');
 let user=name.replace(/\s/g,'_')+'_'+Math.floor(Math.random()*100);
 let end=new Date(); end.setDate(end.getDate()+14);
 myRest={name,owner,phone,plan:'trial',end:end.toISOString(),user,pass,status:'trial'};
 let all=JSON.parse(localStorage.getItem('sufra_restaurants')||'[]'); all.push(myRest); localStorage.setItem('sufra_restaurants',JSON.stringify(all));
 let link=location.origin+'/menu.html?r='+user;
 document.getElementById('formBox').style.display='none'; document.getElementById('doneBox').style.display='block';
 document.getElementById('info').innerHTML=`المطعم: <b>${name}</b><br>يوزر: <b>${user}</b><br>باسورد: <b>${pass}</b><br>ينتهي التجريبي: ${end.toLocaleDateString('ar-YE')}`;
 document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(link);
 document.getElementById('menuLink').href=link; document.getElementById('menuLink').innerText=link;
}
function sendWA(type){
 let plan=document.getElementById('plan')?.value||'تجريبي';
 let planName= plan==='monthly'?'شهري 15,000':plan==='3months'?'3 شهور 40,000':plan==='yearly'?'سنوي 120,000':'تجريبي مجاني 14 يوم';
 let msg=`مرحباً أسامة، أنا مطعم ${myRest.name}، رقمي ${myRest.phone}، سجلت في سفرة وأبغى ${planName}`;
 window.open('https://wa.me/967774907728?text='+encodeURIComponent(msg),'_blank');
}
function requestSub(){
 let plan=document.getElementById('plan').value;
 let reqs=JSON.parse(localStorage.getItem('sufra_requests')||'[]'); reqs.push({...myRest,reqPlan:plan,date:new Date().toISOString()}); localStorage.setItem('sufra_requests',JSON.stringify(reqs));
 sendWA('sub'); alert('تم إرسال طلبك ✅ بيوصلك للمالك في الموقع والواتساب');
}
function goLogin(){ location.href='login.html'; }
</script></body></html>
