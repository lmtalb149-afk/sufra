<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>دخول المطعم - سُفرة</title><style>*{box-sizing:border-box;font-family:Arial;margin:0}body{background:#0a0a0a;color:#fff;padding:20px}.box{max-width:420px;margin:60px auto;background:#141414;border:1px solid #222;border-radius:20px;padding:25px;text-align:center}h1 span{color:#c9a227}input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:10px 0}button{width:100%;padding:14px;border-radius:30px;border:0;background:linear-gradient(135deg,#f5d76e,#c9a227);font-weight:900;margin-top:10px;cursor:pointer}a{color:#c9a227;display:block;margin-top:15px}</style></head><body>
